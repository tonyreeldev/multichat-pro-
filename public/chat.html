<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multichat View</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;700&family=Poppins:wght@400;700&family=Bebas+Neue&family=Fredoka:wght@600&display=swap" rel="stylesheet">
    <style>
        :root { --font-size: 18px; --bg-opacity: 0.4; --text-color: #ffffff; --font-family: 'Segoe UI', sans-serif; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: transparent; font-family: var(--font-family); color: var(--text-color); font-size: var(--font-size); overflow: hidden; height: 100vh; width: 100vw; }
        
        /* Layout Base: Vertical (Default) */
        #chat-container { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; padding: 20px; gap: 10px; }
        
        /* Layout: Horizontal */
        body.layout-horizontal #chat-container { 
            flex-direction: row; 
            justify-content: flex-start; 
            align-items: center; 
            overflow-x: hidden; 
            gap: 15px;
            padding: 10px 20px;
        }
        body.layout-horizontal .message-item { 
            min-width: 250px; 
            max-width: 450px; 
            flex-shrink: 0; 
            white-space: normal; /* Permite que el texto salte de línea dentro de la burbuja */
            display: flex;
            flex-direction: column;
        }

        /* Layout: Ticker (Noticiero) */
        body.layout-ticker {
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        body.layout-ticker #chat-container { 
            display: inline-flex; /* Crucial: El contenedor se expande según el contenido */
            flex-direction: row; 
            align-items: center; 
            justify-content: flex-start; 
            white-space: nowrap; 
            height: 85px; 
            padding: 0 50px; 
            gap: 100px; 
            overflow: visible; /* Dejamos que el contenido salga para medirlo bien */
            will-change: transform;
        }
        body.layout-ticker .message-item { 
            display: flex; 
            gap: 12px; 
            align-items: center; 
            flex-shrink: 0;
            white-space: nowrap; /* En Ticker preferimos una sola línea larga por mensaje */
            max-width: none; /* Sin límite para que el Ticker sea una cinta continua */
        }
        /* En modo Ticker, evitamos forzar el fondo base si hay un estilo específico */
        body.layout-ticker .message-item.bubble-default {
            background: rgba(15, 23, 42, var(--bg-opacity)); 
            border-radius: 8px;
            padding: 8px 15px;
        }

        /* Layout: Scroll (Infinito) */
        body.layout-scroll #chat-container { justify-content: flex-start; animation: scroll-up 60s linear infinite; }
        @keyframes scroll-up { from { transform: translateY(0); } to { transform: translateY(-100%); } }

        .message-item { 
            will-change: transform, opacity;
            backface-visibility: hidden;
            animation: fadeIn 0.3s ease-out forwards; 
            padding: 10px 15px; 
            border-radius: 12px; 
            background: rgba(15, 23, 42, var(--bg-opacity)); 
            border-left: 4px solid #3b82f6; 
            max-width: 100%; 
            word-wrap: break-word; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        .author { font-weight: 700; margin-bottom: 4px; font-size: 0.9em; display: flex; align-items: center; gap: 6px; }
        .platform-tag { 
            font-size: 0.65em; 
            padding: 2px 8px; 
            border-radius: 4px; 
            background: rgba(255,255,255,0.1); 
            text-transform: uppercase; 
            font-weight: 800; 
            margin-right: 4px;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255,255,255,0.05);
            display: inline-block;
            line-height: 1.2;
        }
        .content { line-height: 1.4; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
        .emote { height: 1.2em; vertical-align: middle; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-10px); } }
        .message-item.fade-out { animation: fadeOut 0.5s ease-in forwards; }
        .avatar-img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; }
        
        /* Bubble Style Variations */
        .bubble-default { /* Hereda estilos base de .message-item */ }
        
        .bubble-messaging {
            border-radius: 18px 18px 18px 4px;
            padding: 10px 15px;
        }
        
        .bubble-minimal {
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 6px 10px;
        }
        
        .bubble-glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }
        
        .bubble-avatar {
            padding-left: 50px;
            position: relative;
        }
        .bubble-avatar .avatar-img {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
        }

        /* Nuevos Estilos */
        .bubble-neon {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid var(--border-color, #3b82f6);
            box-shadow: 0 0 15px var(--border-color, #3b82f6), inset 0 0 10px var(--border-color, #3b82f6);
            border-radius: 10px;
        }
        
        .bubble-retro {
            border: 4px solid #fff;
            box-shadow: 4px 4px 0px #000, 8px 8px 0px var(--border-color, #3b82f6);
            border-radius: 0;
            background: #000;
            font-family: 'Courier New', monospace;
            padding: 12px;
        }
        
        .bubble-gradient {
            background: linear-gradient(135deg, var(--border-color, #3b82f6) 0%, rgba(15, 23, 42, 0.7) 100%);
            border: none;
            border-left: 5px solid #fff;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .bubble-border {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-left: 10px solid var(--border-color, #3b82f6);
            border-radius: 4px 15px 15px 4px;
            padding: 12px 20px;
            box-shadow: -5px 0 20px -10px var(--border-color, #3b82f6);
        }
    </style>
</head>
<body>
    <div id="chat-container"></div>
    <script>
        const socket = io();
        const container = document.getElementById('chat-container');
        const urlParams = new URLSearchParams(window.location.search);
        const layout = urlParams.get('layout') || 'vertical';
        document.body.classList.add(`layout-${layout}`);

        let currentStyle = { bubbleStyle: 'default', autoHide: 0 };

        socket.on('apply_style', (style) => {
            console.log('Style received:', style);
            currentStyle = style;
            document.documentElement.style.setProperty('--font-size', style.fontSize);
            document.documentElement.style.setProperty('--bg-opacity', style.bgOpacity);
            document.documentElement.style.setProperty('--text-color', style.textColor);
            document.documentElement.style.setProperty('--font-family', style.fontFamily);
            const bubbleClass = `bubble-${style.bubbleStyle || 'default'}`;
            document.querySelectorAll('.message-item').forEach(msg => {
                msg.className = `message-item ${bubbleClass}`;
            });
            console.log('Applied bubble class:', bubbleClass);
        });

        socket.on('new_message', (data) => {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message-item bubble-${currentStyle.bubbleStyle || 'default'}`;
            msgDiv.style.borderColor = data.color || '#3b82f6';
            msgDiv.style.setProperty('--border-color', data.color || '#3b82f6');

            const platformColors = {
                twitch: { bg: '#9146FF', text: '#fff' },
                youtube: { bg: '#FF0000', text: '#fff' },
                tiktok: { bg: '#fe2c55', text: '#fff' },
                kick: { bg: '#53FC18', text: '#000' }
            };
            const pConf = platformColors[data.platform?.toLowerCase()] || { bg: '#3b82f6', text: '#fff' };

            let contentHTML = '';
            if (data.parts && data.parts.length > 0) {
                data.parts.forEach(p => {
                    if (p.type === 'text') contentHTML += `<span>${escapeHTML(p.content)}</span>`;
                    else if (p.type === 'emote') contentHTML += `<img src="${p.url}" class="emote">`;
                });
            } else {
                contentHTML = `<span>${escapeHTML(data.message)}</span>`;
            }

            const avatarUrl = data.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(data.author)}&background=random&color=fff`;

            msgDiv.innerHTML = `
                ${currentStyle.bubbleStyle === 'avatar' ? `<img src="${avatarUrl}" class="avatar-img">` : ''}
                <div style="flex:1">
                    <div class="author">
                        <span class="platform-tag" style="background-color: ${pConf.bg}; color: ${pConf.text}; border: none;">${data.platform ? data.platform.toUpperCase() : ''}</span>
                        <span style="color: ${data.color || '#ffffff'}">${data.author}</span>
                    </div>
                    <div class="content">${contentHTML}</div>
                </div>
            `;

            container.appendChild(msgDiv);
            
            // Lógica de Auto-Ocultado
            if (currentStyle.autoHide > 0 && layout !== 'ticker' && layout !== 'scroll') {
                setTimeout(() => {
                    msgDiv.classList.add('fade-out');
                    setTimeout(() => {
                        if (msgDiv.parentNode === container) container.removeChild(msgDiv);
                    }, 500);
                }, currentStyle.autoHide * 1000);
            }

            if (container.children.length > 50) container.removeChild(container.firstChild);
            
            if (layout === 'vertical') window.scrollTo(0, document.body.scrollHeight);
            if (layout === 'horizontal') {
                setTimeout(() => {
                    container.scrollTo({
                        left: container.scrollWidth,
                        behavior: 'smooth'
                    });
                }, 50);
            }
        });

        // Motor de Ticker Fluido - Versión Estabilidad Total
        let tickerPos = window.innerWidth;
        let isPaused = false;

        function animateTicker() {
            if (layout === 'ticker' && !isPaused) {
                const contentWidth = container.offsetWidth;
                
                if (container.children.length > 0) {
                    tickerPos -= 1.8; // Velocidad ajustada
                    
                    // Si todo el bloque de mensajes ha pasado el borde izquierdo
                    if (tickerPos < -contentWidth) {
                        tickerPos = window.innerWidth; // Reinicia desde la derecha
                    }
                } else {
                    tickerPos = window.innerWidth;
                }
                container.style.transform = `translateX(${tickerPos}px)`;
            }
            requestAnimationFrame(animateTicker);
        }

        // Forzar actualización de posición cuando llegan mensajes nuevos
        socket.on('new_message', () => {
            if (layout === 'ticker' && container.children.length === 1) {
                // Si es el primer mensaje, nos aseguramos de que empiece a moverse
                if (tickerPos < 0) tickerPos = window.innerWidth;
            }
        });

        // Pausar con mouse si está activado
        container.addEventListener('mouseenter', () => { if (currentStyle.pauseOnHover) isPaused = true; });
        container.addEventListener('mouseleave', () => { isPaused = false; });

        if (layout === 'ticker') {
            animateTicker();
        }

        function escapeHTML(str) {
            const p = document.createElement('p');
            p.textContent = str;
            return p.innerHTML;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multichat View</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --font-size: 18px; --bg-opacity: 0.4; --text-color: #ffffff; --font-family: 'Segoe UI', sans-serif; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: transparent; font-family: var(--font-family); color: var(--text-color); font-size: var(--font-size); overflow: hidden; height: 100vh; width: 100vw; }
        
        /* Layout Base: Vertical (Default) */
        #chat-container { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; padding: 20px; gap: 10px; }
        
        /* Layout: Horizontal */
        body.layout-horizontal #chat-container { flex-direction: row; justify-content: flex-start; align-items: flex-end; overflow-x: auto; }
        body.layout-horizontal .message-item { min-width: 250px; max-width: 350px; flex-shrink: 0; }

        /* Layout: Ticker (Noticiero) */
        body.layout-ticker #chat-container { flex-direction: row; align-items: center; justify-content: flex-start; white-space: nowrap; height: 60px; padding: 0; gap: 40px; animation: ticker-move 30s linear infinite; }
        body.layout-ticker .message-item { background: transparent; border: 0; padding: 0; display: inline-flex; gap: 10px; align-items: center; box-shadow: none; }
        @keyframes ticker-move { from { transform: translateX(100%); } to { transform: translateX(-100%); } }

        /* Layout: Scroll (Infinito) */
        body.layout-scroll #chat-container { justify-content: flex-start; animation: scroll-up 60s linear infinite; }
        @keyframes scroll-up { from { transform: translateY(0); } to { transform: translateY(-100%); } }

        .message-item { animation: fadeIn 0.3s ease-out forwards; padding: 10px 15px; border-radius: 12px; background: rgba(15, 23, 42, var(--bg-opacity)); border-left: 4px solid #3b82f6; max-width: 100%; word-wrap: break-word; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .author { font-weight: 700; margin-bottom: 4px; font-size: 0.9em; display: flex; justify-content: space-between; gap: 10px; }
        .platform-tag { font-size: 0.6em; opacity: 0.5; text-transform: uppercase; }
        .content { line-height: 1.4; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
        .emote { height: 1.2em; vertical-align: middle; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .avatar-img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; }
    </style>
</head>
<body>
    <div id="chat-container"></div>
    <script>
        const socket = io();
        const container = document.getElementById('chat-container');
        const urlParams = new URLSearchParams(window.location.search);
        const layout = urlParams.get('layout') || 'vertical';
        document.body.classList.add(`layout-${layout}`);

        let currentStyle = { bubbleStyle: 'default' };

        socket.on('apply_style', (style) => {
            currentStyle = style;
            document.documentElement.style.setProperty('--font-size', style.fontSize);
            document.documentElement.style.setProperty('--bg-opacity', style.bgOpacity);
            document.documentElement.style.setProperty('--text-color', style.textColor);
            document.documentElement.style.setProperty('--font-family', style.fontFamily);
        });

        socket.on('new_message', (data) => {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message-item bubble-${currentStyle.bubbleStyle}`;
            msgDiv.style.borderColor = data.color || '#3b82f6';

            let contentHTML = '';
            if (data.parts && data.parts.length > 0) {
                data.parts.forEach(p => {
                    if (p.type === 'text') contentHTML += `<span>${escapeHTML(p.content)}</span>`;
                    else if (p.type === 'emote') contentHTML += `<img src="${p.url}" class="emote">`;
                });
            } else {
                contentHTML = `<span>${escapeHTML(data.message)}</span>`;
            }

            msgDiv.innerHTML = `
                ${currentStyle.bubbleStyle === 'avatar' ? `<img src="${data.avatar || 'https://kick.com/img/default-profile-pictures/default2.jpeg'}" class="avatar-img">` : ''}
                <div style="flex:1">
                    <div class="author" style="color: ${data.color || '#ffffff'}">
                        ${data.author}
                        <span class="platform-tag">${data.platform}</span>
                    </div>
                    <div class="content">${contentHTML}</div>
                </div>
            `;

            container.appendChild(msgDiv);
            if (container.children.length > 50) container.removeChild(container.firstChild);
            if (layout === 'vertical' || layout === 'horizontal') window.scrollTo(0, document.body.scrollHeight);
        });

        function escapeHTML(str) {
            const p = document.createElement('p');
            p.textContent = str;
            return p.innerHTML;
        }
    </script>
</body>
</html>
